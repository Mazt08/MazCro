name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file EXE
        run: |
          python -m PyInstaller --clean --noconfirm MazCro-onefile.spec

      - name: Verify EXE exists
        run: |
          if (-not (Test-Path dist\MazCro.exe)) { throw "MazCro.exe was not produced" }
          Get-Item dist\MazCro.exe | Select-Object Name, Length

      - name: Package ZIP
        run: |
          Compress-Archive -Path dist\MazCro.exe -DestinationPath MazCro-${{ github.ref_name }}.zip
          Get-FileHash dist\MazCro.exe -Algorithm SHA256 | Out-File MazCro.sha256 -Encoding ascii

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MazCro-windows
          path: |
            MazCro-*.zip
            MazCro.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MazCro-*.zip
            MazCro.sha256
          generate_release_notes: true
